<meta name="color-scheme" content="light dark">
<title>PlanForge</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f2600f'/%3E%3Cstop offset='1' stop-color='%23f7a53b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 21h14M12 21v-4l-3-4h10l4-3 1 3-3 4h-6v4' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#/plans" aria-label="PlanForge home">
      <span class="mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 16.5h14M8 16.5v-3l-2.6-3h8.1l3.2-2.6 1 2.6-2.5 3H10.5v3"/>

        </svg>
      </span>
      <span class="brand-text">PlanForge<em>idea &rarr; shipped</em></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/preferences" data-nav="preferences">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>

      </a>
      <a href="#/plans" data-nav="plans">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h9a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H9M9 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h3M9 4v16"/><path d="M12 8h4M12 12h4M12 16h2"/></svg>

      <a href="#/runs" data-nav="runs">

        Runs
      </a>
    </nav>
    <div class="side-foot" id="side-foot"><span class="dim">connecting&hellip;</span></div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <div class="boot-splash"><span class="spinner"></span></div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
